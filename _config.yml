# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

lang: pt-BR

timezone: America/Recife

title: Ewerton Nascimento

tagline: Desenvolvimento de Software e Arquitetura

description: >-
  Estou jogando aqui algumas anotações sobre Desenvolvimento de Software.

url: "https://ewertoncodes.github.io"

github:
  username: ewertoncodes

twitter:
  username: ewertoncodes

social:
  name: Ewerton Nascimento
  email: ewertonorg@gmail.com
  links:
    - https://github.com/ewertoncodes
    - https://twitter.com/ewertoncodes
    - https://www.linkedin.com/in/ewerton-nascimento
    - mailto:ewertonorg@gmail.com

webmaster_verifications:
  google: # fill in your Google verification code
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

analytics:
  google:
    id: G-T1N7N755P8  # ← seu GA aplicado aqui
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

pageviews:
  provider:

theme_mode: # [light | dark]

cdn:

avatar: /assets/img/profile.jpeg  # ⚠️ mova images/profile.jpeg para assets/img/

social_preview_image:

toc: true

comments:
  provider:
  disqus:
    shortname:
  utterances:
    repo:
    issue_term:
  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping:
    strict:
    input_position:
    lang:
    reactions_enabled:

assets:
  self_host:
    enabled:
    env:

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

paginate: 10

baseurl: ""

# ------------ Não mexa abaixo desta linha ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
future: true
future: true
