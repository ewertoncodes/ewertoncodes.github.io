name: Publish to dev.to

on:
  push:
    branches:
      - main
    paths:
      - "_posts/**.md"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Install dependencies
        run: gem install yaml front_matter_parser

      - name: Detect new posts and publish to dev.to
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          BLOG_URL: "https://ewertoncodes.github.io"
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NEW_POSTS=$(ls _posts/*.md 2>/dev/null || true)
          else
            NEW_POSTS=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- '_posts/**.md')
          fi

          if [ -z "$NEW_POSTS" ]; then
            echo "Nenhum post novo encontrado."
            exit 0
          fi

          for POST in $NEW_POSTS; do
            echo "Publicando: $POST"
            
            # Lê o post usando Ruby com parsing correto
            ruby <<RUBY
require 'json'
require 'net/http'
require 'uri'
require 'yaml'

post_path = '$POST'
blog_url = '$BLOG_URL'
api_key = '$DEVTO_API_KEY'

# Lê o arquivo
content = File.read(post_path)

# Separa front matter e body
parts = content.split('---', 3)
if parts.length >= 3
  front_matter = YAML.safe_load(parts[1])
  body = parts[2].strip
else
  puts "ERRO: Front matter inválido em #{post_path}"
  exit 1
end

# Extrai dados
title = front_matter['title']
description = front_matter['description'] || ''
tags = front_matter['tags'] || []
tags = tags.first(4) if tags.is_a?(Array)
tags = ['database'] if tags.nil? || tags.empty?

# Gera slug e canonical
filename = File.basename(post_path, '.md')
slug = filename.gsub(/^\d{4}-\d{2}-\d{2}-/, '')
canonical = "\#{blog_url}/posts/\#{slug}/"

# Remove sintaxe do Jekyll do body
body.gsub!(/\{:\s*\.prompt-\w+\s*\}/, '')

puts "Título: #{title}"
puts "Tags: #{tags.join(', ')}"
puts "Canonical: #{canonical}"

# Prepara payload
payload = {
  article: {
    title: title,
    body_markdown: body,
    published: true,
    canonical_url: canonical,
    description: description,
    tags: tags
  }
}

# Faz a requisição
uri = URI('https://dev.to/api/articles')
http = Net::HTTP.new(uri.host, uri.port)
http.use_ssl = true

request = Net::HTTP::Post.new(uri)
request['api-key'] = api_key
request['Content-Type'] = 'application/json'
request.body = payload.to_json

response = http.request(request)

if response.code.to_i >= 200 && response.code.to_i < 300
  result = JSON.parse(response.body)
  puts "✅ Publicado com sucesso!"
  puts "🔗 URL: #{result['url']}"
else
  puts "❌ Erro: #{response.code}"
  puts response.body
  exit 1
end
RUBY
          done
