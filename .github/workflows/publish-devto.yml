name: Publish to dev.to

on:
  push:
    branches:
      - main
    paths:
      - "_posts/**.md"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect new posts and publish to dev.to
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          BLOG_URL: "https://ewertoncodes.github.io"
        run: |
          NEW_POSTS=$(git diff --name-only --diff-filter=A HEAD~1 HEAD -- '_posts/**.md')

          if [ -z "$NEW_POSTS" ]; then
            echo "Nenhum post novo encontrado."
            exit 0
          fi

          for POST in $NEW_POSTS; do
            echo "Publicando: $POST"
            POST_PATH="$POST" python3 - << 'PYEOF'
          import os, re, json, urllib.request, urllib.error

          post_path = os.environ["POST_PATH"]
          blog_url = os.environ["BLOG_URL"]
          api_key = os.environ["DEVTO_API_KEY"]

          with open(post_path, "r") as f:
              content = f.read()

          parts = content.split("---", 2)
          front_matter = parts[1] if len(parts) >= 3 else ""
          body = parts[2].strip() if len(parts) >= 3 else content

          def get_field(fm, key):
              match = re.search(rf"^{key}:\s*(.+)$", fm, re.MULTILINE)
              return match.group(1).strip().strip("'\"") if match else ""

          def get_list_field(fm, key):
              match = re.search(rf"^{key}:\s*\n((?:- .+\n?)+)", fm, re.MULTILINE)
              if not match:
                  return []
              return [line.strip("- ").strip() for line in match.group(1).strip().split("\n")]

          title = get_field(front_matter, "title")
          description = get_field(front_matter, "description")
          tags = get_list_field(front_matter, "tags")[:4]

          filename = os.path.basename(post_path).replace(".md", "")
          slug = re.sub(r"^\d{4}-\d{2}-\d{2}-", "", filename)
          canonical = f"{blog_url}/posts/{slug}/"

          body = re.sub(r"\{:\s*\.prompt-\w+\s*\}", "", body)

          payload = {
              "article": {
                  "title": title,
                  "body_markdown": body,
                  "published": True,
                  "canonical_url": canonical,
                  "description": description,
                  "tags": tags,
              }
          }

          data = json.dumps(payload).encode("utf-8")
          req = urllib.request.Request(
              "https://dev.to/api/articles",
              data=data,
              headers={"Content-Type": "application/json", "api-key": api_key},
              method="POST",
          )

          try:
              with urllib.request.urlopen(req) as res:
                  result = json.loads(res.read())
                  print(f"Publicado com sucesso!")
                  print(f"URL: {result.get('url')}")
                  print(f"Canonical: {canonical}")
          except urllib.error.HTTPError as e:
              print(f"Erro ao publicar: {e.code} - {e.read().decode()}")
              exit(1)
          PYEOF
          done
